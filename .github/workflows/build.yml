name: Build V2Rexo APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: npm install

      - name: Align versions with Expo SDK
        run: npx expo install --fix

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Fix Gradle task order for Xray
        run: |
          cat >> android/app/build.gradle <<'EOF'

          tasks.whenTaskAdded { task ->
            if (task.name.contains('desugar')) {
              task.dependsOn project(':expo-xray-vpn').tasks.matching { it.name == 'extractXrayAar' }
            }
          }
          EOF

      - name: Compile APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: V2Rexo-APK
          path: android/app/build/outputs/apk/debug/*.apk
