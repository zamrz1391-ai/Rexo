name: Build V2Rexo APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: نصب Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: نصب Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: نصب پکیج‌ها
        run: npm install

      - name: تولید پروژه نیتیو اندروید
        run: npx expo prebuild --platform android --no-install

      - name: کامپایل APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: آماده‌سازی خروجی
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/V2Rexo.apk

      - name: انتشار APK
        uses: actions/upload-artifact@v4
        with:
          name: V2Rexo-APK
          path: output/V2Rexo.apk